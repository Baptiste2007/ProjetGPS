<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Compte</title>
    <link rel="stylesheet" href="styles.css">
    <script src="main.js" defer></script>
    <link rel="icon" href="../../docs/images/favicon.svg" type="image/svg+xml" />


    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@2.0.0-beta.5/dist/leaflet.css"
        integrity="sha256-LJzbbQFquR1Trwrwy++9x2Pl6ipfBZUR8Da0GGJ8Wfo=" crossorigin="" />
    <script type="importmap">
		{
			"imports": {
				"leaflet": "https://cdn.jsdelivr.net/npm/leaflet@2.0.0-beta.5/dist/leaflet.js"
			},
			"integrity": {
				"https://cdn.jsdelivr.net/npm/leaflet@2.0.0-beta.5/dist/leaflet.js": "sha256-wtAeAyJwpxq8jkj3LfBxdh3sPS3xw9kViJv+AtdXLDE="
			}
		}
	</script>

    <style>
        html,
        body {
            height: 100%;
            margin: 0;
        }

        .leaflet-container {
            height: 100%;
        }
    </style>


</head>

<body>
    <section id="loginSection">
        <div id="bandeau">

            <h1>Connexion</h1>

            <div id="menu">
                <div id="menuhaut"></div>
                <div id="menubas"></div>
            </div>
            <div id="menu2">
                <div id="menuhaut2"></div>
                <div id="menubas2"></div>
            </div>
        </div>
        <div id="contenu">
            <form id="loginForm">
                <label for="loginInput">Identifiant</label>
                <input id="loginInput" name="login" type="text" required>

                <label for="passwordInput">Mot de passe</label>
                <input id="passwordInput" name="password" type="password" required>

                <button class="stylebutton" type="submit">Se connecter</button>
            </form>
            <button class="stylebutton" id="showSignup" type="button">Créer un compte</button>



        </div>
        <div id="piedpage"></div>
    </section>

    <section id="signupSection" hidden>
        <h1>Créer un compte</h1>
        <form id="signupForm">
            <label for="signupLogin">Identifiant</label>
            <input id="signupLogin" name="inputValue" type="text" required>

            <label for="signupPassword">Mot de passe</label>
            <input id="signupPassword" name="inputValue2" type="password" required>

            <button type="submit">
                S'inscrire
            </button>
        </form>
        <button id="showLogin" type="button">Retour à la connexion</button>
    </section>


    <section id="dashboardSection" hidden>
        <div id="bandeau">

            <h1 id="welcomeMessage"></h1>

        </div>
        <div id="menu">
            <div id="menuhaut"></div>
            <div id="menubas"></div>
        </div>
        <div id="menu2">
            <div id="menuhaut2"></div>
            <div id="menubas2"></div>
        </div>
        </div>



        <div id="contenu">
            <div id='map'></div>

            <script type="module">
                import { LeafletMap, TileLayer, Marker, Circle, Polygon, Popup } from 'leaflet';

                const map = new LeafletMap('map').setView([51.505, -0.09], 13);

                const tiles = new TileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
                    maxZoom: 19,
                    attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>'
                }).addTo(map);


                function onMapClick(e) {
                    popup
                        .setLatLng(e.latlng)
                        .setContent(`You clicked the map at ${e.latlng.toString()}`)
                        .openOn(map);
                }

                map.on('click', onMapClick);
            </script>



        </div>

        <div id="piedpage">
            <button class="stylebutton" id="logoutButton" type="button">Déconnexion</button>
            <button class="stylebutton" id="deleteAccountButton" type="button">Supprimer mon compte</button>
        </div>



        <section id="adminSection" hidden>
            <h2>Gestion des comptes</h2>
            <ul id="usersList"></ul>
        </section>
    </section>
</body>

</html>
